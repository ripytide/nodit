[package]
name = "nodit"
version = "0.10.0"
edition = "2021"
description = """
This crate provides Discrete Interval Tree Data-Structures, which are based
off BTreeMap.
"""
documentation = "https://docs.rs/nodit"
readme = "README.md"
homepage = "https://github.com/ripytide/nodit"
repository = "https://github.com/ripytide/nodit"
license = "MIT"
keywords = ["data-structures", "map", "data", "library"]
categories = ["data-structures"]

[dependencies]
serde = { version = "1.0.229", features = [
	"derive",
], default-features = false, optional = true }
btree_monstrousity = { version = "0.0.6", features = [
	"btree_drain_filter",
	"btree_cursors",
], default-features = false }
itertools = { version = "0.15.0", default-features = false }
smallvec = { version = "1.16.4", default-features = false }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.rust]
missing_docs = "deny"
